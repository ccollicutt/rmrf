name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test.yml'
      - 'Makefile'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test.yml'
      - 'Makefile'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y make binutils

    - name: Install uv
      run: pip install uv

    - name: Create virtual environment
      run: uv venv .venv

    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run linter
      run: |
        source .venv/bin/activate
        make lint

    - name: Run type checker
      run: |
        source .venv/bin/activate
        make type-check

    - name: Run security scanner
      run: |
        source .venv/bin/activate
        make security

    - name: Run unit tests
      run: |
        source .venv/bin/activate
        make test-unit

    - name: Run integration tests
      run: |
        source .venv/bin/activate
        make test-integration
